services:

  # ── Base de données MySQL 8.0 ─────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: gf_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_MIGRATIONS_USER: ${MYSQL_MIGRATIONS_USER}
      MYSQL_MIGRATIONS_PASSWORD: ${MYSQL_MIGRATIONS_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/01-privileges.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API Symfony (PHP-FPM + Nginx) ─────────────────────────────────────────
  symfony_app:
    build:
      context: .
      dockerfile: docker/symfony/Dockerfile
      target: dev
    container_name: gf_symfony
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql_db:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4"
      DATABASE_URL_MIGRATIONS: "mysql://${MYSQL_MIGRATIONS_USER}:${MYSQL_MIGRATIONS_PASSWORD}@mysql_db:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1|192\.168\.\d+\.\d+)(:[0-9]+)?$'
    depends_on:
      mysql_db:
        condition: service_healthy

  # ── Frontend React / Vite ────────────────────────────────────────────────
  react_app:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
    container_name: gf_react
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ""
    depends_on:
      - symfony_app

  # ── phpMyAdmin (accès local uniquement) ──────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: gf_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  # ATTENTION : `docker compose down -v` supprime ce volume et efface toutes les données MySQL.
  # Faire un dump avant (voir docker/scripts/backup.sh).
  mysql_data:
