services:

  # ── Base de données MySQL 8.0 ─────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: gf_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aquiplants_db
      MYSQL_USER: aquiplants
      MYSQL_PASSWORD: aquiplants
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API Symfony (PHP-FPM + Nginx) ─────────────────────────────────────────
  symfony_app:
    build:
      context: .
      dockerfile: docker/symfony/Dockerfile
    container_name: gf_symfony
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var
    environment:
      APP_ENV: dev
      APP_SECRET: aquiplants_dev_secret_change_in_production
      DATABASE_URL: "mysql://aquiplants:aquiplants@mysql_db:3306/aquiplants_db?serverVersion=8.0&charset=utf8mb4"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: aquiplants
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1|192\.168\.\d+\.\d+)(:[0-9]+)?$'
    depends_on:
      mysql_db:
        condition: service_healthy

  # ── Frontend React / Vite ────────────────────────────────────────────────
  react_app:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
    container_name: gf_react
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ""
    depends_on:
      - symfony_app

  # ── phpMyAdmin ───────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gf_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: aquiplants
      MYSQL_PASSWORD: aquiplants
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data:
