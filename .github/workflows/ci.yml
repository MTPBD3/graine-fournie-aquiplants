name: CI

on:
  push:
    branches: [ main, develop, feature/setup-backend ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, intl, openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate JWT keys (for functional tests)
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -passout pass:aquiplants -out config/jwt/private.pem -aes256 4096
          openssl pkey -in config/jwt/private.pem -passin pass:aquiplants -out config/jwt/public.pem -pubout

      - name: Run unit tests
        working-directory: backend
        run: vendor/bin/phpunit --testsuite Unit --colors=always

      - name: Run functional tests
        working-directory: backend
        env:
          APP_ENV: test
        run: vendor/bin/phpunit --testsuite Functional --colors=always

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  deploy:
    name: Deploy (Docker Hub)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push symfony image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/symfony/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/symfony:latest

      - name: Build and push react image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/react/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/react:latest
