# --- www -> domaine nu, en HTTPS directement ---
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.graine-fournie.online;

    ssl_certificate     /etc/letsencrypt/live/graine-fournie.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graine-fournie.online/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://graine-fournie.online$request_uri;
    }
}

# --- HTTP (domaine nu + IP) : challenge ACME + redirection vers HTTPS ---
server {
    listen 80;
    server_name graine-fournie.online 46.105.29.41 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://graine-fournie.online$request_uri;
    }
}

# --- HTTPS : l'application ---
server {
    listen 443 ssl;
    http2 on;
    server_name graine-fournie.online;

    ssl_certificate     /etc/letsencrypt/live/graine-fournie.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graine-fournie.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Court au départ (5 min) : on augmentera une fois tout validé en conditions réelles.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api {
        proxy_pass http://symfony:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://react:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
